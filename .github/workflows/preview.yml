name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Needed to push to gh-pages and comment on the PR
permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build (direct weather mode, PR-scoped base URL)
        run: npm run build
        env:
          VITE_DIRECT_WEATHER: 'true'
          VITE_BASE_URL: /mtb-trail-conditions/previews/pr-${{ github.event.pull_request.number }}/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/client
          target-folder: previews/pr-${{ github.event.pull_request.number }}
          # clean only removes stale files within this PR's subfolder,
          # leaving other PR previews untouched.
          clean: true

      - name: Comment on PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const owner  = context.repo.owner;
            const repo   = context.repo.repo;
            const pr     = context.issue.number;
            const url    = `https://${owner}.github.io/${repo}/previews/pr-${pr}/`;
            const marker = '<!-- mtb-preview-bot -->';
            const body   = `${marker}\n🚵 **Preview:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr, body,
              });
            }
